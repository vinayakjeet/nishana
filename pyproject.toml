[project]
name = "nishana"
version = "0.1.0"
description = "A QLoRA fine-tune on one narrow Hinglish support-ticket task, scored against a frontier baseline with the ablation that shows which part did the work."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "structlog>=24.4",
    "httpx>=0.27",
    "tenacity>=9.0",
    "pyyaml>=6.0",
    "pydantic>=2.9",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
